name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted: the repo is public, and a self-hosted runner would execute
    # fork PRs on the host machine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run engine tests
        # TOOLCHAINS stripped: a broken 6.3.1 pin lingers in some shells; the workflow
        # must always build with the Xcode-selected toolchain.
        run: |
          unset TOOLCHAINS
          swift test

  style:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # SwiftLucid judges only what changed since the base, so it needs that history.
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: BuildTools/.build
          key: buildtools-${{ runner.os }}-${{ hashFiles('BuildTools/Package.resolved') }}
      - name: Build the pinned tools
        run: |
          unset TOOLCHAINS
          swift build -c release --package-path BuildTools --product swiftlucid
          swift build -c release --package-path BuildTools --product swiftstepdown
      - name: Lint the doc comments this change adds or changes
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          BuildTools/.build/release/swiftlucid --include-tests --since "$base" .
      - name: Check every file is in stepdown order
        run: BuildTools/.build/release/swiftstepdown --lint Sources Tests

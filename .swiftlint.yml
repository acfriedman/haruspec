# Style decisions 2026-08-01: defaults on purpose — identifier_name (min 3 chars),
# line_length (120 warning), and trailing_comma (forbidden) are all deliberate.
excluded:
  - .build

# Doc-comment shape gates (guidelines: .claude/skills/doc-comments/SKILL.md).
# missing_docs deliberately NOT enabled yet — backfill is a separate decision.
custom_rules:
  doc_prose_before_markup:
    name: "Doc Prose Before Markup"
    regex: '\n[ \t]*///[ \t]*\n[ \t]*/// (?!- )\S[^\n]*\n(?:[ \t]*///[^\n]*\n)*?[ \t]*/// - (Parameters?|Returns|Throws|Precondition|Important)\b'
    message: "Deterministic doc order: summary, then the markup block, then notes. Move `- Parameters:`/`- Returns:` up."
    severity: warning
  doc_summary_length:
    name: "Doc Summary Length"
    regex: '\n(?![ \t]*///)[^\n]*\n([ \t]*)/// (?!- )[^\n]+\n(?:\1/// (?!- )[^\n]+\n){2,}'
    message: "Doc summary is one paragraph of at most two lines; push the rest below the markup block as notes."
    severity: warning
  no_block_doc_comment:
    name: "Block Doc Comment"
    regex: '/\*\*'
    message: "Use /// doc comments, not /** */."
    severity: error
  doc_markup_capitalized:
    name: "Doc Markup Capitalization"
    regex: '///\s*-\s+(parameter|parameters|returns|throws|note|warning|precondition|postcondition|important|invariant|complexity|seealso)[ :]'
    message: "Capitalize doc markup keywords: `- Returns:`, not `- returns:`."
    severity: error

identifier_name:
  excluded:
    # `id` is idiomatic Swift (Identifiable, JSON-RPC ids).
    - id
    # Capitalized DSL factory functions that read like declarations (deliberate idiom).
    - Seam
    - Ordering
    - Budget
    # The intent modifier's one spelling: `Changes(…).to(11363)` reads as the sentence it is.
    - to
    # The spec's own noun for a declared operation (`Op<S>`, `op:<label>` boundaries, `OpIdentity`).
    - op
    # The argument label of `.only(in: "checkout")`, mirrored on `OpScope.only(in:)`.
    - in

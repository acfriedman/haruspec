# Style decisions 2026-08-01: defaults on purpose — identifier_name (min 3 chars),
# line_length (120 warning), and trailing_comma (forbidden) are all deliberate.
excluded:
  - .build

# Doc-comment shape is SwiftLucid's job (.swiftlucid.json; guidelines in
# .claude/skills/doc-comments/SKILL.md), so SwiftLint carries no doc rules of its own.

identifier_name:
  excluded:
    # `id` is idiomatic Swift (Identifiable, JSON-RPC ids).
    - id
    # Capitalized DSL factory functions that read like declarations (deliberate idiom).
    - Seam
    - Ordering
    - Budget
    # The intent modifier's one spelling: `Changes(…).to(11363)` reads as the sentence it is.
    - to
    # The spec's own noun for a declared operation (`Op<S>`, `op:<label>` boundaries, `OpIdentity`).
    - op
    # The argument label of `.only(in: "checkout")`, mirrored on `OpScope.only(in:)`.
    - in
